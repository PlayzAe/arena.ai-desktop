<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#252523"/>
  <g transform="translate(256, 256)" fill="none" stroke="#F4F0EB" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pillar top beam -->
    <line x1="-120" y1="-100" x2="120" y2="-100"/>
    <!-- Left pillar -->
    <line x1="-90" y1="-100" x2="-90" y2="100"/>
    <!-- Center pillar -->
    <line x1="0" y1="-100" x2="0" y2="100"/>
    <!-- Right pillar -->
    <line x1="90" y1="-100" x2="90" y2="100"/>
    <!-- Base beam -->
    <line x1="-120" y1="100" x2="120" y2="100"/>
    <!-- Pediment triangle -->
    <polyline points="-120,-100 0,-160 120,-100"/>
  </g>
</svg>
