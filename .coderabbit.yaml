# Quiet CodeRabbit setup: one short summary, only real problems, no bot PRs.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
    ignore_usernames: ["dependabot[bot]"]
  path_filters:
    - "!**/*.lock"
    - "!arena/web/static/app.js"
    - "!dist/**"
    - "!build/**"
    - "!docs/screenshots/**"
chat:
  auto_reply: false
